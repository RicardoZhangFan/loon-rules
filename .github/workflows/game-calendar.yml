name: Weekly game calendar update
on:
  schedule:
    - cron: '17 1 * * 1' # Monday 09:17 Beijing time
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: game-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sources and rebuild ICS
        run: python3 game-calendar/scripts/update_calendar.py
      - name: Commit updated tracking state and calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-calendar/data/state.json game-calendar/data/changes.json game-calendar/latest-check.md game-calendar/calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m "chore(calendar): weekly official source check"
            git push
          fi
      - name: Create review issue for official-source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          p='game-calendar/data/changes.json'
          changes=json.load(open(p))
          if not changes:
              print('No official-page changes')
              raise SystemExit(0)
          body='Official pages changed. Verify release dates with original announcements before editing the calendar.\n\n'
          for c in changes:
              body+=f"- **{c['game']}**: {c['url']} — {c['change']}\n"
          subprocess.run(['gh','issue','create','--title','Game calendar: official pages changed, please review','--body',body],check=True)
          PY
